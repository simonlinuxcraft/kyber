[package]
name = "rust_lib"
version = "0.1.0"
edition = "2018"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# MAXIMA-LINUX-PORT-MOD 2026-08-15: "log" added. Without it flutter_rust_bridge
# reports a dropped stream sink through println!, which panics on EPIPE once our
# stdout is a pipe nobody reads any more. That took the launcher down mid-session
# with "failed printing to stdout" right after a game start. With the feature the
# same message goes through the log crate into the launcher log, where the
# flutter_logger below already receives it.
flutter_rust_bridge = { version = "=2.11.1", default-features = false, features = ["anyhow", "user-utils", "dart-opaque", "backtrace", "thread-pool", "rust-async", "uuid", "log"] }
tokio = { version = "1.36.0", features = ["full", "rt", "rt-multi-thread", "time", "net"] }
tokio-util = "0.7"
log = "0.4.20"
maxima-lib = { path = "../../ThirdParty/Maxima/maxima-lib" }
lazy_static = "1.4.0"
regex = { version = "1.10.2", features = [] }
anyhow = "1.0.79"
flutter_logger = "0.6.1"
tar = "0.4.43"
zip = { version = "=2.4.2", features = ["deflate"], default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.155"

[patch.crates-io]
pelite = { git = 'https://github.com/lifegpc/pelite.git' }
async-compression = { git = 'https://github.com/ArmchairDevelopers/async-compression.git' }
flate2 = { git = 'https://github.com/ArmchairDevelopers/flate2-rs.git' }
