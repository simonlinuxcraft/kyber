[toolchain]
# Bumped from nightly-2025-01-01 to match the Launcher's pinned channel.
# Some transitive deps (icu_collections 2.2, sha2-const 0.1.3) require
# rustc >= 1.86, which 2025-01-01 does not have.
channel = "nightly-2026-04-06"

targets = [
    # Windows
    "x86_64-pc-windows-msvc",

    # Linux
    #"aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",

    # macOS
    "aarch64-apple-darwin",
]